<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="Тренировки А и Б: упражнения, описания и отметки выполнения.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Fitness · Тренировка</title>
  <link rel="icon" href="./assets/icons/favicon-32.png?v=3" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=3">
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <script>try{var a=localStorage.getItem('fitness.appearance')||'auto';document.documentElement.dataset.appearance=a;document.documentElement.dataset.theme=a==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):a;}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}</script>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Для работы трекера включите JavaScript в браузере.</noscript>
  <script type="module" src="./app.js?v=4"></script>
</body>
</html>
